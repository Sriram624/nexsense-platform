server:
  port: 8080
  error:
    include-message: never
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexsense}
    username: ${SPRING_DATASOURCE_USERNAME:nexsense}
    password: ${SPRING_DATASOURCE_PASSWORD:dev-only-change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:nexsense-backend}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  # For TLS deployments set broker-url to ssl://host:8883 and configure JVM truststore.
security:
  jwt:
    # Set a random base64-encoded secret of at least 32 bytes in non-demo deployments.
    secret: ${JWT_SECRET:ZGV2LXNlY3JldC1jaGFuZ2UtdGhpcy1iZWZvcmUtcHJvZHVjdGlvbi0zMi1ieXRlcw==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
